# Docker Compose configuration for the askwild-stack development environment

name: askwild-stack
services:
  askwild:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/askwild}:latest
    command: npx next start -H 0.0.0.0
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - askwild:builder
        - askwild:latest
    env_file: .env.local # Load environment variables
    environment:
      # Database connection for Docker Compose (override any cloud DB from .env.local)
      DATABASE_URL: postgresql://${POSTGRES_USER:-askwild}:${POSTGRES_PASSWORD:-askwild}@postgres:5432/${POSTGRES_DB:-askwild}
      DATABASE_RESTRICTED_URL: postgresql://${POSTGRES_USER:-askwild}:${POSTGRES_PASSWORD:-askwild}@postgres:5432/${POSTGRES_DB:-askwild}
      DATABASE_SSL_DISABLED: 'true' # Disable SSL for local Docker PostgreSQL
      # Authentication settings (default: disabled for personal Docker use)
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      ANONYMOUS_USER_ID: ${ANONYMOUS_USER_ID:-docker-anonymous}
      # Better Auth and SMTP settings are deliberately NOT declared here:
      # `environment` entries override `env_file`, and ${VAR} interpolation
      # reads the shell or a project .env file — never .env.local. Declaring
      # them with empty defaults would wipe the values users put in
      # .env.local. Configure AUTH_PROVIDER, BETTER_AUTH_SECRET,
      # AUTH_SIGNUP_MODE, BOOTSTRAP_ADMIN_EMAIL and SMTP_* in .env.local
      # (see "Better Auth" in docs/CONFIGURATION.md).
      ASKWILD_CLOUD_DEPLOYMENT: 'false'
      # Docker-internal service URLs
      LOCAL_REDIS_URL: ${LOCAL_REDIS_URL:-redis://redis:6379}
      SEARCH_API: ${SEARCH_API:-searxng}
      SEARXNG_API_URL: ${SEARXNG_API_URL:-http://searxng:8080}
      # Version footer / update check (all optional, see docs/CONFIGURATION.md)
      # ASKWILD_INSTALL_METHOD: docker # Footer label; the image already sets this
      # ASKWILD_UPDATE_CHECK_REPO: miurla/askwild # Upstream repo to check (default: miurla/askwild)
      # ASKWILD_UPDATE_CHECK_TTL_SECONDS: '86400' # Check cache window in seconds (default: 86400, floor 300)
      # ASKWILD_UPDATE_CHECK_DISABLED: 'false' # Set to 'true' to skip upstream requests entirely
      # ASKWILD_ADMIN_EMAILS: 'ops@example.com' # Extra admin emails for the update link (providers without roles)
    ports:
      - '3000:3000' # Maps port 3000 on the host to port 3000 in the container.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      searxng:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askwild}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askwild}
      POSTGRES_DB: ${POSTGRES_DB:-askwild}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-askwild}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  searxng:
    image: searxng/searxng
    ports:
      - '${SEARXNG_PORT:-8080}:8080'
    env_file: .env.local # can remove if you want to use env variables or in settings.yml
    volumes:
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      - ./searxng-settings.yml:/etc/searxng/settings.yml
      - searxng_data:/data

volumes:
  postgres_data:
  redis_data:
  searxng_data:
