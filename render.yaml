# askwild search service (OpenSERP) — free Google/Bing/DuckDuckGo SERP.
# Deploy from the Render dashboard:  New → Blueprint Instance → this repository
# → it detects this file and creates a free "askwild-search" web service.
# Then set OPENSERP_URL=https://askwild-search.onrender.com and
# SEARCH_API=openserp in the Askwild Vercel environment.
#
# Render provides PORT=10000 to every service; this image listens there.
# The prebuilt karust/openserp image has NO CMD (entrypoint prints usage and
# exits 128 on its own) — Dockerfile.search adds the explicit serve command.

services:
  - type: web
    name: askwild-search
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.search
    autoDeploy: true
