name: Keep SearXNG Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping SearXNG search endpoint
        env:
          SEARXNG_API_URL: ${{ vars.SEARXNG_API_URL || 'https://hawkin-searx.onrender.com' }}
        run: |
          curl -sS --max-time 60 -o /dev/null -w "searxng_status=%{http_code}\n" \
            "${SEARXNG_API_URL}/search?q=keepalive&format=json"
